<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar | CineMax</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <script src="../assets/js/script.js" defer></script>
</head>
<body>

  <header>
     <a href="../index.html"><img src="assets/img/logo.png" alt="Logotipo do CineMax" width="60" height="60"></a>
     <p><strong>CineMax</strong></p>
     <nav aria-label="Navegação principal">
          <ul>
             <li><a href="../index.html">Início</a></li>
             <li><a href="../index.html#catalogo">Catálogo</a></li>
             <li><a href="../index.html#minha-lista">Minha lista</a></li>

             <li><a href="cadastro.html">Criar conta</a></li>
          </ul>
     </nav>
  </header>

   <main>
       <section aria-labelledby="titulo-login">
          <h1 id="titulo-login">Entrar</h1>
          <form action="../index.html" method="get">
             <label for="login-email">E-mail</label>
             <input type="email" id="login-email" name="email" autocomplete="email" required>

             <label for="login-senha">Senha</label>
             <input type="password" id="login-senha" name="senha" autocomplete="current-password" minlength="6" required>

             <label><input type="checkbox" name="lembrar"> Manter conectado</label>

             <button type="submit">Entrar</button>
          </form>
           <p><a href="#">Esqueci minha senha</a></p>
           <p>Ainda não tem conta? <a href="cadastro.html">Criar conta</a></p>
      </section>

  </main>

  <footer>
      <p>&copy; 2026 CineMax. Projeto acadêmico.</p>
  </footer>

</body>
</html>
