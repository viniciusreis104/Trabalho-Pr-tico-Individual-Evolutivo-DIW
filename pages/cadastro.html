<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar conta | CineMax</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <script src="../assets/js/script.js" defer></script>
</head>
<body>

  <header>
      <a href="../index.html"><img src="pages/assets/img/logo.png" alt="Logotipo do CineMax" width="60" height="60"></a>
      <p><strong>CineMax</strong></p>
      <nav aria-label="Navegação principal">
          <ul>
             <li><a href="../index.html">Início</a></li>
             <li><a href="../index.html#catalogo">Catálogo</a></li>
             <li><a href="../index.html#minha-lista">Minha lista</a></li>
             <li><a href="novo-titulo.html">Cadastrar título</a></li>
             <li><a href="login.html">Entrar</a></li>
             <li><a href="cadastro.html">Criar conta</a></li>
          </ul>
      </nav>
    </header>

  <main>
    <section aria-labelledby="titulo-cadastro">
      <h1 id="titulo-cadastro">Criar conta</h1>
      <form action="login.html" method="get">
          <label for="cad-nome">Nome completo</label>
          <input type="text" id="cad-nome" name="nome" autocomplete="name" required>

          <label for="cad-email">E-mail</label>
          <input type="email" id="cad-email" name="email" autocomplete="email" required>

          <label for="cad-nascimento">Data de nascimento</label>
          <input type="date" id="cad-nascimento" name="nascimento" required>

          <label for="cad-senha">Senha (mínimo de 6 caracteres)</label>
          <input type="password" id="cad-senha" name="senha" autocomplete="new-password" minlength="6" required>

          <label for="cad-confirma">Confirmar senha</label>
          <input type="password" id="cad-confirma" name="confirma" autocomplete="new-password" minlength="6" required>

          <fieldset>
              <legend>Gêneros favoritos</legend>
              <label><input type="checkbox" name="generos" value="acao"> Ação</label>
              <label><input type="checkbox" name="generos" value="comedia"> Comédia</label>
              <label><input type="checkbox" name="generos" value="drama"> Drama</label>
              <label><input type="checkbox" name="generos" value="ficcao"> Ficção científica</label>
              <label><input type="checkbox" name="generos" value="terror"> Terror</label>
          </fieldset>

          <label><input type="checkbox" name="termos" required> Li e aceito os termos de uso</label>

          <button type="submit">Criar conta</button>
      </form>
      <p>Já tem conta? <a href="login.html">Entrar</a></p>
    </section>

  </main>

  <footer>
     <p>&copy; 2026 CineMax. Projeto acadêmico.</p>
  </footer>

</body>
</html>
